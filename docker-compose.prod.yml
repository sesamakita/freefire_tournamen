version: "3.8"

services:
  web:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: arena-tempur-web
    restart: always
    ports:
      # Port 80 langsung agar bisa diakses langsung via http://IP-VPS tanpa :3000
      - "80:3000"
      - "3000:3000"
    env_file:
      - .env
    environment:
      - NODE_ENV=production
      - PORT=3000
