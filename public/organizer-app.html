<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
  <title>Arena Tempur — Organizer Hub</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      background-color: #09090b;
      color: #ffffff;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      text-align: center;
      padding: 24px;
    }
    .logo {
      width: 80px;
      height: 80px;
      margin-bottom: 20px;
      border-radius: 20px;
      box-shadow: 0 10px 30px rgba(245, 158, 11, 0.2);
    }
    h1 {
      font-size: 20px;
      font-weight: 800;
      letter-spacing: 1px;
      margin-bottom: 8px;
      color: #f59e0b;
    }
    p {
      font-size: 13px;
      color: #a1a1aa;
      max-width: 280px;
      line-height: 1.5;
    }
    .spinner {
      margin-top: 24px;
      width: 32px;
      height: 32px;
      border: 3px solid rgba(245, 158, 11, 0.2);
      border-top-color: #f59e0b;
      border-radius: 50%;
      animation: spin 0.8s linear infinite;
    }
    @keyframes spin {
      to { transform: rotate(360deg); }
    }
  </style>
</head>
<body>
  <img src="/images/logo-monogram.svg" alt="Arena Tempur" class="logo" onerror="this.style.display='none'">
  <h1>ARENA TEMPUR PANITIA</h1>
  <p>Memuat Portal Lapangan & Kontrol Turnamen...</p>
  <div class="spinner"></div>

  <script>
    // Redirect ke server atau dashboard lokal
    setTimeout(function() {
      window.location.href = "/admin";
    }, 600);
  </script>
</body>
</html>
